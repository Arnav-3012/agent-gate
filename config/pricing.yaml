# Reference small-model API price used to MODEL cost (local inference is $0). D4/D20.
# Source: https://platform.claude.com/docs/en/about-claude/pricing (prompts <= 100k tokens tier).
# Prompt cache and batch discounts are deliberately not modelled: all prompt tokens at the base
# input rate (conservative, and cache hits on the local server are noise, not a cost signal).
reference_model: claude-haiku-5-5
verified_on: 2026-10-21
usd_per_1m_tokens: {input: 0.10, output: 0.50}
# Size tiering (D29): decode cost per token scales with parameter count (~2N FLOPs/token), so the
# 14B arm is priced at 2x the verified rate. An ASSUMPTION layered on a verified anchor, not a quote.
# Hosted arms (D52): real list prices relative to the Haiku anchor, verified 2026-10-22 on the same page:
# Sonnet 5.5 $2 / $10 per 1M = exactly 20x Haiku 5.5 on input and output.
model_multiplier: {qwen2.5-7b: 1.0, qwen2.5-14b: 2.0, claude-haiku-5-5: 1.0, claude-sonnet-5-5: 20.0}
retrieval_usd_per_query: 0.0   # local Qdrant; no verified cloud price, so 0 (revisit if hosted)
infra_usd_per_query: 0.0       # AWS free tier; revisit with Phase 5 numbers

# D53 "true marginal" cost view for LOCAL arms (eval/budget_curve.py): energy only, = latency_s x watts
# / 3.6e6 x usd_per_kwh. ASSUMPTIONS, not quotes: M4 Pro package power under MLX decode ~40 W (measure:
# `sudo powermetrics --samplers cpu_power,gpu_power` during a query), electricity ~$0.10/kWh. Hardware
# amortisation excluded (sunk). Hosted arms keep their list price in both views.
local_energy: {watts: 40, usd_per_kwh: 0.10}
