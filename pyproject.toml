[project]
name = "agentgate"
version = "0.1.0"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.110", "uvicorn>=0.29", "httpx>=0.27", "pydantic>=2.6",
  "pyyaml>=6", "numpy>=1.26", "scikit-learn>=1.4", "qdrant-client>=1.9",
  "sentence-transformers>=3", "datasets>=2.19", "boto3>=1.34",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.4", "umap-learn>=0.5", "mlx-lm>=0.14"]
infra = [
    "aws-cdk-lib>=2.274.0",
    "constructs>=10.8.1",
]

[tool.ruff]
line-length = 100
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
